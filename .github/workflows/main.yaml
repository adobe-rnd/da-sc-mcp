name: Build

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on feature branches, but never on main:
  # canceling an in-flight release could leave a tag pushed without a deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI_BUILD_NUM: ${{ github.run_id }}
  CI_BRANCH: ${{ github.ref_name }}

# Default to least privilege; jobs that need more elevate per-job.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm install
      - run: npm run lint
      - run: npm run type-check
      - run: npm test

  test-deploy:
    name: Test Deploy
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    needs: test
    timeout-minutes: 15
    permissions:
      contents: write        # semantic-release-dry's verifyConditions probes push capability
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm install
      - name: Semantic Release (Dry Run)
        run: npm run semantic-release-dry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Branch Deployment
        run: npm run deploy:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: test
    timeout-minutes: 15
    permissions:
      contents: write        # semantic-release pushes tags and commits
      issues: read           # semantic-release reads linked issues
      pull-requests: write   # semantic-release comments on PRs
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm install
      - name: Semantic Release
        # semantic-release runs `publishCmd: npm run deploy:production` as part
        # of its release flow, so the Cloudflare secrets must reach this step.
        run: npm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
